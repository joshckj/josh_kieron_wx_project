# =============================================================================
# Pipeline configuration
# Change values here to experiment; no code edits needed.
# =============================================================================

# -----------------------------------------------------------------------------
# data: where the data comes from and how it is stored (used by data_loader.py)
# -----------------------------------------------------------------------------
data:
  csv_path: data/proj_machine_readings.csv   # raw source file
  db_path: data/machine_readings.db          # SQLite database built from the CSV
  table_name: machine_readings               # table that holds the readings
  csv_chunksize: 20000                       # rows per insert when building the DB
  timestamp_column: timestamp                # parsed as datetime when loading

  # The loader stops with a clear error if any of these are missing from the
  # dataset (e.g. a column was renamed or removed). Extra columns are fine.
  required_columns:
    - timestamp
    - machine_id
    - temperature
    - vibration
    - maintenance_required

# -----------------------------------------------------------------------------
# features: which columns the models use
# NOTE: draft values taken from the EDA (eda.ipynb). The group should confirm
# these before the cleaning and modelling code starts reading them.
# -----------------------------------------------------------------------------
features:
  target: maintenance_required               # what we predict (0 = no, 1 = yes)

  # Raw sensor readings. Humidity, pressure and energy_consumption showed no
  # link to the target in the EDA; remove them here to test dropping them.
  sensors:
    - temperature
    - vibration
    - humidity
    - pressure
    - energy_consumption

  # Derived columns that leak the answer (EDA Step 8), so they are never used
  # as model inputs.
  exclude_leakage:
    - failure_type
    - machine_status
    - anomaly_flag
    - predicted_remaining_life
    - downtime_risk

  # Cut-offs found in the EDA (Step 7): at or above these values every row
  # needed maintenance. Used to build the threshold features for linear models.
  thresholds:
    temperature: 90                          # degrees C
    vibration: 80                            # mm/s (absolute value)

# -----------------------------------------------------------------------------
# preprocessing: cleaning, splitting, imputation, encoding, and scaling
# -----------------------------------------------------------------------------
preprocessing:
  drop_leakage: true                         # drop features.exclude_leakage columns
  fix_negative_vibration: true               # convert sign-flipped vibration to abs()
  drop_duplicates: true                      # remove exact duplicate rows
  id_column: machine_id                      # treated as categorical, never scaled
  split:
    strategy: stratified                     # "stratified" or "time"
    test_size: 0.2                           # fraction reserved for test set
    random_state: 42                         # seed for reproducible stratified splits

# -----------------------------------------------------------------------------
# feature_engineering: row-level features only (used by feature_engineering.py)
# -----------------------------------------------------------------------------
feature_engineering:
  add_threshold_flags: true                  # temperature_over_90, vibration_over_80
  add_rolling_features: false                # looks at earlier rows, so off by default
  rolling_columns: [temperature, vibration]
  rolling_windows: [3, 5, 10]
  binning: {}                                # fixed edges, e.g. temperature: [60, 75, 90]
  drop_columns: []

# -----------------------------------------------------------------------------
# transformation: fitted on the TRAIN split only (used by transformation.py)
# -----------------------------------------------------------------------------
transformation:
  imputer_strategy: median                   # "mean", "median", or "most_frequent"
  add_missing_indicator: false               # add binary missingness indicator columns
  scaler: standard                           # "standard", "minmax", "robust", or "none"
  encode_machine_id: false                   # true = one-hot encode machine_id; false = drop it

# -----------------------------------------------------------------------------
# models: shared training settings (used by models/base_model.py)
# -----------------------------------------------------------------------------
models:
  cv_folds: 5
  scoring: balanced_accuracy                 # target is imbalanced (about 20% positive)
  random_state: 42
  tuning:
    enabled: false
    method: random                           # "grid" or "random"
    n_iter: 10                               # random search only

  gradient_boosting:                         # models/gradient_boosting.py
    params:
      learning_rate: 0.1
      max_iter: 200
      max_depth: 6
      class_weight: balanced
    param_grid:
      learning_rate: [0.03, 0.1, 0.3]
      max_iter: [100, 200, 400]
      max_depth: [3, 6, 10]

logging:
  level: INFO
